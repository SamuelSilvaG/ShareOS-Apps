<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PassphraseGen</title>
  <link rel="stylesheet" href="/_shareos/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="sos-app gen-body">
  <header class="gen-header">
    <div class="brand">
      <span class="brand-icon">🎲</span>
      <span class="brand-title">PassphraseGen</span>
      <span class="version-badge">v1.0.0</span>
    </div>
    <div class="header-right">
      <button class="icon-nav-btn" id="save-history-btn" title="Verlauf auf Box sichern">💾 Sichern</button>
      <div class="account-pill" id="user-display">Account: ...</div>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <main class="gen-workspace">
    <!-- Main Result Card -->
    <section class="result-card">
      <div class="phrase-display" id="phrase-display">klicke auf generieren</div>
      <div class="entropy-bar-container">
        <div class="entropy-bar" id="entropy-bar"></div>
      </div>
      <div class="entropy-label" id="entropy-label">Entropie: ~0 Bit (Sicherheit: –)</div>

      <div class="action-row">
        <button class="primary-btn" id="generate-btn">🎲 Neue Passphrase</button>
        <button class="copy-btn" id="copy-btn">📋 Kopieren</button>
      </div>
    </section>

    <!-- Configuration Settings -->
    <section class="settings-card">
      <div class="settings-grid">
        <div class="setting-item">
          <div class="setting-head">
            <label for="word-count-slider">Wortanzahl: <span id="word-count-val">4</span></label>
          </div>
          <input type="range" id="word-count-slider" min="3" max="8" value="4">
        </div>

        <div class="setting-item">
          <label for="separator-select">Trennzeichen</label>
          <select id="separator-select">
            <option value="-" selected>Bindestrich ( - )</option>
            <option value=".">Punkt ( . )</option>
            <option value="_">Unterstrich ( _ )</option>
            <option value=" ">Leerzeichen (   )</option>
            <option value="#">Raute ( # )</option>
            <option value="">Kein Trennzeichen</option>
          </select>
        </div>

        <div class="setting-item">
          <label for="case-select">Schreibweise</label>
          <select id="case-select">
            <option value="lower" selected>kleinbuchstaben</option>
            <option value="title">WortAnfangGross (TitleCase)</option>
            <option value="upper">GROSSBUCHSTABEN</option>
          </select>
        </div>

        <div class="setting-item toggle-item">
          <label class="toggle-label">
            <input type="checkbox" id="add-number-check" checked>
            <span>Zufallszahl anhängen (0-99)</span>
          </label>
        </div>
      </div>
    </section>

    <!-- Saved History -->
    <section class="history-card">
      <div class="history-head">
        <span>LETZTE GENERIERTE PASSPHRASEN</span>
        <button class="clear-hist-btn" id="clear-hist-btn">Verlauf leeren</button>
      </div>
      <div class="history-list" id="history-list"></div>
    </section>
  </main>

  <footer class="gen-footer">
    <span id="storage-status">Verbinde mit Box-Dateisystem...</span>
    <span>Algorithmus: WebCrypto Diceware (CSPRNG)</span>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <script src="/_shareos/app.js"></script>
    <script src="sos-i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
