zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 51f9a52ab6c84c7dab138bf1ab0808fa
    name: Templates/Storage devices
  templates:
  - uuid: 33e54b4e6e0146b7811a6422a4f35eaf
    template: ShareOS by Zabbix agent active
    name: ShareOS by Zabbix agent active
    description: 'Disks, RAID and temperature of a ShareOS NAS (D-Link DNS-320L and family) through the classic Zabbix agent in active mode (system app "zabbix-agent"). Link it together with "Linux by Zabbix agent active" for CPU, memory, network and file systems.


      Generated by tools/zabbix/make-template.py in the ShareOS repository.'
    vendor:
      name: ShareOS
      version: 7.0-1
    groups:
    - name: Templates/Storage devices
    items:
    - uuid: 91735bf6d4894c9289600158f1529e5c
      name: 'Box: temperature'
      type: ZABBIX_ACTIVE
      key: shareos.box[temperature]
      delay: 1m
      value_type: FLOAT
      units: °C
      tags:
      - tag: component
        value: environment
      triggers:
      - uuid: 198974d6f70f466abc5b5cd35ef4d0c0
        expression: 'min(/ShareOS by Zabbix agent active/shareos.box[temperature],5m)>={$SHAREOS.BOX.TEMP.WARN}'
        name: 'ShareOS: box is hot (over {$SHAREOS.BOX.TEMP.WARN} °C for 5 minutes)'
        priority: WARNING
        description: The temperature of the box (board sensor). Check the fan and the place of the box.
    - uuid: 083717b98c14466b85dbb489b7a9de22
      name: 'Box: fan speed'
      type: ZABBIX_ACTIVE
      key: shareos.box[fan_rpm]
      delay: 1m
      units: rpm
      tags:
      - tag: component
        value: environment
    - uuid: c1c0e8c0e445413ca54438cad458ccb8
      name: 'Box: fan level (PWM 0-255)'
      type: ZABBIX_ACTIVE
      key: shareos.box[fan_pwm]
      delay: 1m
      tags:
      - tag: component
        value: environment
    - uuid: db18dbbc0b57485abfa8cde32ef16d4a
      name: ShareOS version
      type: ZABBIX_ACTIVE
      key: shareos.box[version]
      delay: 1h
      value_type: CHAR
      trends: '0'
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: bd89735a9d9b472787c86d9abbf27783
        expression: change(/ShareOS by Zabbix agent active/shareos.box[version])=1
        name: 'ShareOS: firmware updated to {ITEM.LASTVALUE1}'
        priority: INFO
        manual_close: 'YES'
    - uuid: ee853884bc534c0abe014377cb551cdd
      name: Box model
      type: ZABBIX_ACTIVE
      key: shareos.box[board]
      delay: 1d
      value_type: CHAR
      trends: '0'
      tags:
      - tag: component
        value: system
    discovery_rules:
    - uuid: 2915d39bd556404aa9be269e5d895cf3
      name: Disks in the bays
      type: ZABBIX_ACTIVE
      key: shareos.disk.discovery
      delay: 1h
      description: The SATA disks of the box (no USB drives), with model and serial number.
      item_prototypes:
      - uuid: 7b2d600963994735be18118819425231
        name: 'Disk {#DISK}: health rating'
        type: ZABBIX_ACTIVE
        key: 'shareos.disk[{#DISK},rating]'
        delay: 5m
        description: 'The rating of Storage → Health: 0 good, 1 warning, 2 critical (from SMART values, self-tests, temperature, wear).'
        valuemap:
          name: ShareOS disk rating
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
        trigger_prototypes:
        - uuid: 8073c9e1bb8142d48ba771d948c9a8e5
          expression: 'last(/ShareOS by Zabbix agent active/shareos.disk[{#DISK},rating])=2'
          name: 'Disk {#DISK} ({#MODEL}): critical – replace soon'
          priority: HIGH
          description: See Storage → Health on the box for the reasons.
        - uuid: 35ab517de0c04899a14a5af366ba47eb
          expression: 'last(/ShareOS by Zabbix agent active/shareos.disk[{#DISK},rating])=1'
          name: 'Disk {#DISK} ({#MODEL}): SMART warning'
          priority: WARNING
          description: See Storage → Health on the box for the reasons.
      - uuid: 6daabe3fbdc6480486927bcdad2c37e2
        name: 'Disk {#DISK}: SMART overall health passed'
        type: ZABBIX_ACTIVE
        key: 'shareos.disk[{#DISK},passed]'
        delay: 5m
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
        trigger_prototypes:
        - uuid: 3fa26a3332a145b496a62fd7a0b58460
          expression: 'last(/ShareOS by Zabbix agent active/shareos.disk[{#DISK},passed])=0'
          name: 'Disk {#DISK} ({#MODEL}): SMART health check failed'
          priority: HIGH
      - uuid: 3cd046eb92dc464e9408d24d077f0d45
        name: 'Disk {#DISK}: temperature'
        type: ZABBIX_ACTIVE
        key: 'shareos.disk[{#DISK},temperature]'
        delay: 5m
        value_type: FLOAT
        units: °C
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
        trigger_prototypes:
        - uuid: 5ba0d9f0ddc549f1a6be08b29cd8a6af
          expression: 'last(/ShareOS by Zabbix agent active/shareos.disk[{#DISK},temperature])>={$SHAREOS.DISK.TEMP.WARN}'
          name: 'Disk {#DISK} ({#MODEL}): hot (over {$SHAREOS.DISK.TEMP.WARN} °C)'
          priority: WARNING
      - uuid: 19c874b3ed014186bf283495f0b970e3
        name: 'Disk {#DISK}: highest temperature (lifetime)'
        type: ZABBIX_ACTIVE
        key: 'shareos.disk[{#DISK},temperature_max]'
        delay: 1h
        value_type: FLOAT
        units: °C
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
      - uuid: b56bd7d0e20c40579236e258fb45bb77
        name: 'Disk {#DISK}: reallocated sectors'
        type: ZABBIX_ACTIVE
        key: 'shareos.disk[{#DISK},reallocated]'
        delay: 5m
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
        trigger_prototypes:
        - uuid: 2de5d1166b034ee0a97d8763280cc59d
          expression: 'change(/ShareOS by Zabbix agent active/shareos.disk[{#DISK},reallocated])>0'
          name: 'Disk {#DISK} ({#MODEL}): new reallocated sectors'
          priority: WARNING
          manual_close: 'YES'
      - uuid: 49207c34888e4ae9a8c4854574e9a545
        name: 'Disk {#DISK}: pending sectors'
        type: ZABBIX_ACTIVE
        key: 'shareos.disk[{#DISK},pending]'
        delay: 5m
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
        trigger_prototypes:
        - uuid: 0a7e916f6eae42388e7ade7251a11f25
          expression: 'last(/ShareOS by Zabbix agent active/shareos.disk[{#DISK},pending])>0'
          name: 'Disk {#DISK} ({#MODEL}): pending sectors ({ITEM.LASTVALUE1})'
          priority: WARNING
      - uuid: aed2f0083e6a4b8b8f9692b3c19719f8
        name: 'Disk {#DISK}: uncorrectable sectors'
        type: ZABBIX_ACTIVE
        key: 'shareos.disk[{#DISK},uncorrectable]'
        delay: 5m
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
      - uuid: 454ac4aa1a1d4eb998aaf7b11836fb63
        name: 'Disk {#DISK}: interface CRC errors'
        type: ZABBIX_ACTIVE
        key: 'shareos.disk[{#DISK},crc_errors]'
        delay: 5m
        description: Usually the cable or the connector, not the disk.
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
        trigger_prototypes:
        - uuid: a6c2cc4c97044b4a86cd3bc3e61587ae
          expression: 'change(/ShareOS by Zabbix agent active/shareos.disk[{#DISK},crc_errors])>0'
          name: 'Disk {#DISK} ({#MODEL}): new CRC errors (connector?)'
          priority: INFO
          manual_close: 'YES'
      - uuid: de15279aa27c4342825e98cb5f65f23b
        name: 'Disk {#DISK}: entries in the SMART error log'
        type: ZABBIX_ACTIVE
        key: 'shareos.disk[{#DISK},error_count]'
        delay: 5m
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
      - uuid: c88d23c3292942c398d7f0928824b0ae
        name: 'Disk {#DISK}: life left (SSD)'
        type: ZABBIX_ACTIVE
        key: 'shareos.disk[{#DISK},life_left]'
        delay: 5m
        units: '%'
        description: Only for SSDs – unsupported for hard disks.
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
        trigger_prototypes:
        - uuid: f8a38b3bce914e82939381bd897ff3da
          expression: 'last(/ShareOS by Zabbix agent active/shareos.disk[{#DISK},life_left])<={$SHAREOS.SSD.LIFE.WARN}'
          name: 'Disk {#DISK} ({#MODEL}): SSD worn ({ITEM.LASTVALUE1} left)'
          priority: WARNING
      - uuid: 82c87069c9c542c6b6e4064b077a86c3
        name: 'Disk {#DISK}: running time'
        type: ZABBIX_ACTIVE
        key: 'shareos.disk[{#DISK},power_on_hours]'
        delay: 1h
        units: h
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
      - uuid: 694f8ae929f04527884a12ae53d7ee39
        name: 'Disk {#DISK}: power cycles'
        type: ZABBIX_ACTIVE
        key: 'shareos.disk[{#DISK},power_cycles]'
        delay: 1h
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
      - uuid: edefa0ef891c4b4c861b353c9c2b1793
        name: 'Disk {#DISK}: asleep'
        type: ZABBIX_ACTIVE
        key: 'shareos.disk[{#DISK},standby]'
        delay: 5m
        description: '1: the disk was asleep at the last read – the values are the last ones before.'
        valuemap:
          name: ShareOS standby
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
      - uuid: e14433aaeb044e7da4883d160e0aaee2
        name: 'Disk {#DISK}: age of the values'
        type: ZABBIX_ACTIVE
        key: 'shareos.disk[{#DISK},age]'
        delay: 5m
        units: s
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
      - uuid: bec0851591174adf837a4cbe7868470c
        name: 'Disk {#DISK}: model'
        type: ZABBIX_ACTIVE
        key: 'shareos.disk[{#DISK},model]'
        delay: 1d
        value_type: CHAR
        trends: '0'
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
      - uuid: e1e50affe1fd4044b6edc99490ffb49f
        name: 'Disk {#DISK}: serial number'
        type: ZABBIX_ACTIVE
        key: 'shareos.disk[{#DISK},serial]'
        delay: 1d
        value_type: CHAR
        trends: '0'
        tags:
        - tag: component
          value: storage
        - tag: disk
          value: '{#DISK}'
        trigger_prototypes:
        - uuid: 45634e99f3534b13b55762e04d378238
          expression: 'change(/ShareOS by Zabbix agent active/shareos.disk[{#DISK},serial])=1'
          name: 'Disk {#DISK}: replaced (new serial number {ITEM.LASTVALUE1})'
          priority: INFO
          manual_close: 'YES'
    - uuid: 6c99e59995314849923a838cbd196609
      name: RAID arrays
      type: ZABBIX_ACTIVE
      key: shareos.raid.discovery
      delay: 1h
      item_prototypes:
      - uuid: dae868ac160642d6a372da4fa55ed564
        name: 'RAID {#RAID}: active'
        type: ZABBIX_ACTIVE
        key: 'shareos.raid[{#RAID},active]'
        delay: 1m
        tags:
        - tag: component
          value: storage
        - tag: raid
          value: '{#RAID}'
        trigger_prototypes:
        - uuid: f6dbc9fbe638460098d3cff154ff154f
          expression: 'last(/ShareOS by Zabbix agent active/shareos.raid[{#RAID},active])=0'
          name: 'RAID {#RAID}: not active'
          priority: HIGH
      - uuid: fba59a381c8b426aa6bcb3a7f57ce2a7
        name: 'RAID {#RAID}: missing disks'
        type: ZABBIX_ACTIVE
        key: 'shareos.raid[{#RAID},missing]'
        delay: 1m
        tags:
        - tag: component
          value: storage
        - tag: raid
          value: '{#RAID}'
        trigger_prototypes:
        - uuid: e7a58a3c4411404d9ca3a93cd90fa341
          expression: 'last(/ShareOS by Zabbix agent active/shareos.raid[{#RAID},missing])>0'
          name: 'RAID {#RAID} ({#LEVEL}): degraded, {ITEM.LASTVALUE1} disk(s) missing'
          priority: HIGH
      - uuid: a066d97407c0494b96711a96dd0cd529
        name: 'RAID {#RAID}: disks'
        type: ZABBIX_ACTIVE
        key: 'shareos.raid[{#RAID},disks]'
        delay: 1h
        tags:
        - tag: component
          value: storage
        - tag: raid
          value: '{#RAID}'
      - uuid: 5fbf5f9f78de4cfdb92dc4ad6e0e1f6a
        name: 'RAID {#RAID}: working disks'
        type: ZABBIX_ACTIVE
        key: 'shareos.raid[{#RAID},working]'
        delay: 1m
        tags:
        - tag: component
          value: storage
        - tag: raid
          value: '{#RAID}'
      - uuid: 1c9abfe36233416b9252de98a38fa66d
        name: 'RAID {#RAID}: state of the members'
        type: ZABBIX_ACTIVE
        key: 'shareos.raid[{#RAID},health]'
        delay: 1m
        value_type: CHAR
        trends: '0'
        description: 'One letter per member: U up, _ missing.'
        tags:
        - tag: component
          value: storage
        - tag: raid
          value: '{#RAID}'
      - uuid: c15f179614324420b8e2ff19bfd5c162
        name: 'RAID {#RAID}: rebuild or check running'
        type: ZABBIX_ACTIVE
        key: 'shareos.raid[{#RAID},syncing]'
        delay: 1m
        tags:
        - tag: component
          value: storage
        - tag: raid
          value: '{#RAID}'
      - uuid: 704c39b324b9417094712327da8b7812
        name: 'RAID {#RAID}: rebuild/check progress'
        type: ZABBIX_ACTIVE
        key: 'shareos.raid[{#RAID},sync_percent]'
        delay: 1m
        value_type: FLOAT
        units: '%'
        tags:
        - tag: component
          value: storage
        - tag: raid
          value: '{#RAID}'
      - uuid: dbf037c0bad949c69c30355d5ad850b7
        name: 'RAID {#RAID}: rebuild/check action'
        type: ZABBIX_ACTIVE
        key: 'shareos.raid[{#RAID},sync_action]'
        delay: 1m
        value_type: CHAR
        trends: '0'
        tags:
        - tag: component
          value: storage
        - tag: raid
          value: '{#RAID}'
      - uuid: 01111bc5fd49414daa7fbc8c7afc82e4
        name: 'RAID {#RAID}: level'
        type: ZABBIX_ACTIVE
        key: 'shareos.raid[{#RAID},level]'
        delay: 1d
        value_type: CHAR
        trends: '0'
        tags:
        - tag: component
          value: storage
        - tag: raid
          value: '{#RAID}'
    tags:
    - tag: class
      value: hardware
    - tag: target
      value: shareos
    macros:
    - macro: '{$SHAREOS.BOX.TEMP.WARN}'
      value: '55'
      description: Box temperature (°C) for a warning
    - macro: '{$SHAREOS.DISK.TEMP.WARN}'
      value: '55'
      description: Disk temperature (°C) for a warning
    - macro: '{$SHAREOS.SSD.LIFE.WARN}'
      value: '20'
      description: SSD life left (%) for a warning
    valuemaps:
    - uuid: f5a07b06bb5b4e6cae318398592dee49
      name: ShareOS disk rating
      mappings:
      - value: '0'
        newvalue: good
      - value: '1'
        newvalue: warning
      - value: '2'
        newvalue: critical
    - uuid: a8572b22117742f8a82d008fc006e12b
      name: ShareOS standby
      mappings:
      - value: '0'
        newvalue: active
      - value: '1'
        newvalue: asleep
