<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetTunnel</title>
<link rel="stylesheet" href="/_shareos/theme.css">
<link rel="stylesheet" href="app.css">
<script src="/_shareos/app.js"></script>
<script src="sos-i18n.js"></script>
</head>
<body class="sos-app">

  <header class="sos-titlebar">
    <div class="tb-left">
      <img src="icon.svg" class="app-icon" alt="">
      <span>NetTunnel</span>
      <span class="tag">1.0.0</span>
    </div>
    <span id="state" class="state">…</span>
  </header>

  <div id="banner" class="banner hidden"></div>

  <nav class="modes" role="tablist">
    <button class="mode on" data-mode="client" role="tab">Box als Client</button>
    <button class="mode" data-mode="server" role="tab">Box als Server</button>
  </nav>

  <main class="workspace" id="view-client">
    <section class="pane">
      <div class="pane-head">
        <span>VPN-Profile</span>
        <span class="acts">
          <button class="sos-btn small" id="add-box">Von der Box …</button>
          <label class="sos-btn small" for="add-file">Vom Computer …</label>
          <input type="file" id="add-file" accept=".ovpn,.conf" hidden>
        </span>
      </div>
      <div id="profiles" class="profiles"><div class="empty muted">Lade …</div></div>
    </section>

    <section class="pane">
      <div class="pane-head"><span>Verbindung</span></div>
      <div id="status" class="status"></div>
      <div class="pane-head">
        <span>Protokoll</span>
        <button class="sos-btn small" id="log-refresh">Aktualisieren</button>
      </div>
      <pre id="log" class="log">–</pre>
    </section>
  </main>

  <main class="workspace hidden" id="view-server">
    <section class="pane">
      <div class="pane-head"><span>VPN-Server</span><span id="srv-state" class="badge">…</span></div>
      <form id="srv-form" class="form">
        <label class="chk"><input type="checkbox" name="enabled"> Server eingeschaltet (startet auch nach einem Neustart)</label>
        <label class="fld"><span>Adresse der Box im Internet (DynDNS-Name oder feste IP)</span><input class="sos-input" name="host" placeholder="meinnas.dyndns.org" spellcheck="false"></label>
        <div class="two">
          <label class="fld"><span>Port</span><input class="sos-input" name="port" type="number" min="1" max="65535" value="1194"></label>
          <label class="fld"><span>Protokoll</span><select class="sos-input" name="proto"><option value="udp">UDP (empfohlen)</option><option value="tcp">TCP</option></select></label>
        </div>
        <label class="fld"><span>VPN-Netz</span><input class="sos-input" name="net" value="10.8.0.0" spellcheck="false"></label>
        <label class="chk"><input type="checkbox" name="lan"> Auch das Heimnetz erreichbar machen (nicht nur die Box)</label>
        <p class="hint" id="srv-hint"></p>
        <div class="dlg-acts"><button class="sos-btn primary" type="submit">Speichern</button></div>
      </form>
    </section>

    <section class="pane">
      <div class="pane-head"><span>Geräte</span></div>
      <form id="dev-form" class="dev-add">
        <input class="sos-input" name="name" placeholder="Name, z. B. handy-jan" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_.\-]{0,31}" required spellcheck="false">
        <button class="sos-btn primary small" type="submit">Gerät hinzufügen</button>
      </form>
      <div id="devices" class="profiles"></div>
      <div class="pane-head"><span>Server-Protokoll</span><button class="sos-btn small" id="srv-log-refresh">Aktualisieren</button></div>
      <pre id="srv-log" class="log">–</pre>
    </section>
  </main>

  <dialog id="dlg" class="sos-dialog">
    <form method="dialog" id="dlg-form">
      <h2 id="dlg-title">Profil einspielen</h2>
      <label class="fld"><span>Name</span><input class="sos-input" name="name" maxlength="40" required pattern="[A-Za-z0-9][A-Za-z0-9 _.\-]{0,39}"></label>
      <div id="dlg-auth">
        <p class="hint" id="dlg-auth-hint">Das Profil verlangt Benutzername und Passwort des VPN.</p>
        <label class="fld"><span>Benutzername</span><input class="sos-input" name="user" autocomplete="off"></label>
        <label class="fld"><span>Passwort</span><input class="sos-input" name="pass" type="password" autocomplete="new-password"></label>
      </div>
      <label class="chk"><input type="checkbox" name="full" checked> Gesamten Verkehr der Box durch den Tunnel</label>
      <p class="hint">Aus: nur die Netze des VPN (z. B. das Büronetz) gehen durch den Tunnel, alles andere wie bisher.</p>
      <label class="chk" id="dlg-auto-row"><input type="checkbox" name="autostart"> Beim Start der Box verbinden</label>
      <div class="dlg-acts">
        <button class="sos-btn" value="cancel" formnovalidate>Abbrechen</button>
        <button class="sos-btn primary" value="ok" id="dlg-ok">Einspielen</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
