<meta name="claude:viewport-fit-sides" content="cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='4' width='48' height='56' rx='8' fill='%23ffffff' stroke='%231c2130' stroke-width='4'/%3E%3Cpath d='M8 12a8 8 0 0 1 8-8h32a8 8 0 0 1 8 8v8H8z' fill='%23ee8a1f'/%3E%3Cpath d='M18 32h28M18 41h28M18 50h18' stroke='%231c2130' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
/* Layout: desktop editor window – menu, toolbar, tabs, side panels, two views, results panel, status bar */
:root{
  --chrome:#e9ecf2; --chrome-2:#dde1ea; --line:#c3c9d6; --ink:#1c2130; --ink-2:#5b6376;
  --paper:#ffffff; --gutter:#f2f3f7; --gutter-ink:#8d93a3; --accent:#ee8a1f; --focus:#3d6fd9;
  --curline:#e9e9ff; --sel:#c6d6f4; --hit:#ffe36b; --ws:#b9bfcc; --match-bg:#c9f0c9; --smart:#9be59b;
  --bm:#2f6fd6; --red-bg:#ffd9d9; --green-bg:#d8f5d8; --yellow-bg:#fff2b8; --mark:#ff9c9c;
  --st1:#7fe3ff; --st2:#ffb96b; --st3:#fff176; --st4:#c9a4ff; --st5:#8fe08f;
  --syn-kw:#0000ff; --syn-str:#808080; --syn-com:#008000; --syn-num:#ff8000; --syn-op:#000080;
  --syn-def:#7b2fbf; --syn-type:#8000ff; --syn-attr:#c41a16; --syn-meta:#8a5a00; --syn-var2:#004d99; --syn-err:#d00000;
  --ui:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif; --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  --shadow:0 8px 24px #1c213033; --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chrome:#22252d; --chrome-2:#2b2f39; --line:#3a3f4c; --ink:#dde1ea; --ink-2:#9aa1b2;
  --paper:#1a1c22; --gutter:#1f2229; --gutter-ink:#666d7e; --accent:#f39a3d; --focus:#6f9bff;
  --curline:#252a37; --sel:#33476e; --hit:#8a7316; --ws:#454b59; --match-bg:#2d4a2d; --smart:#2f5f2f;
  --bm:#5d93ff; --red-bg:#4a2326; --green-bg:#203f25; --yellow-bg:#4a4220; --mark:#7a2f35;
  --st1:#1f5f70; --st2:#7a4a16; --st3:#6b6216; --st4:#4f3a7a; --st5:#2f5f2f;
  --syn-kw:#6fa8ff; --syn-str:#cfa673; --syn-com:#6fae6f; --syn-num:#ff9f5a; --syn-op:#a9b6ff;
  --syn-def:#cf96f0; --syn-type:#c49bff; --syn-attr:#ff8a80; --syn-meta:#d6b36a; --syn-var2:#7cc4ff; --syn-err:#ff6b6b;
  --shadow:0 8px 24px #00000080; color-scheme:dark}}
:root[data-theme="dark"]{
  --chrome:#22252d; --chrome-2:#2b2f39; --line:#3a3f4c; --ink:#dde1ea; --ink-2:#9aa1b2;
  --paper:#1a1c22; --gutter:#1f2229; --gutter-ink:#666d7e; --accent:#f39a3d; --focus:#6f9bff;
  --curline:#252a37; --sel:#33476e; --hit:#8a7316; --ws:#454b59; --match-bg:#2d4a2d; --smart:#2f5f2f;
  --bm:#5d93ff; --red-bg:#4a2326; --green-bg:#203f25; --yellow-bg:#4a4220; --mark:#7a2f35;
  --st1:#1f5f70; --st2:#7a4a16; --st3:#6b6216; --st4:#4f3a7a; --st5:#2f5f2f;
  --syn-kw:#6fa8ff; --syn-str:#cfa673; --syn-com:#6fae6f; --syn-num:#ff9f5a; --syn-op:#a9b6ff;
  --syn-def:#cf96f0; --syn-type:#c49bff; --syn-attr:#ff8a80; --syn-meta:#d6b36a; --syn-var2:#7cc4ff; --syn-err:#ff6b6b;
  --shadow:0 8px 24px #00000080; color-scheme:dark}

html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--chrome-2);color:var(--ink);font:13px/1.4 var(--ui);overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}

.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.app.full{padding:0}
.win{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--chrome);border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:var(--shadow)}
.app.full .win{border:0;border-radius:0}

.menubar{display:flex;gap:1px;padding:3px 6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);flex:none}
.menubar::-webkit-scrollbar{display:none}
.brand{font-weight:600;padding:3px 10px 3px 4px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block}
.mbtn{background:none;border:0;padding:3px 8px;border-radius:3px;cursor:pointer;white-space:nowrap}
.mbtn:hover,.mbtn[aria-expanded="true"]{background:var(--chrome-2)}
.mbtn.rec{color:var(--syn-err);font-weight:600}
.mbtn.fs-btn{display:grid;place-items:center;padding:3px 7px;color:var(--ink-2)}
.mbtn.fs-btn:hover{color:var(--ink)}
.mbtn.fs-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.toolbar{display:flex;align-items:center;gap:1px;padding:3px 6px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.toolbar::-webkit-scrollbar{display:none}
.tbtn{width:28px;height:26px;flex:none;display:grid;place-items:center;background:none;border:1px solid transparent;border-radius:3px;cursor:pointer;color:var(--ink-2);padding:0}
.tbtn:hover{background:var(--paper);border-color:var(--line);color:var(--ink)}
.tbtn[aria-pressed="true"]{background:var(--paper);border-color:var(--line);color:var(--focus)}
.tbtn:disabled{opacity:.35;cursor:default;background:none;border-color:transparent}
.tbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tbtn.rec svg{color:var(--syn-err)}
.tsep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}

.tabbar{display:flex;align-items:flex-end;gap:2px;padding:4px 6px 0;background:var(--chrome-2);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;flex:none;min-height:31px}
.tab{position:relative;display:flex;align-items:center;gap:6px;padding:4px 6px 5px 9px;border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;background:var(--chrome);color:var(--ink-2);cursor:pointer;white-space:nowrap;max-width:220px;flex:none;margin-bottom:-1px;user-select:none}
.tab.active{background:var(--paper);color:var(--ink);padding-top:5px}
.tab.active::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:3px;background:var(--accent);border-radius:4px 4px 0 0}
.tab.drag-over{box-shadow:inset 3px 0 0 var(--focus)}
.tab .nm{overflow:hidden;text-overflow:ellipsis}
.tab .disk{width:8px;height:8px;border-radius:50%;background:var(--focus);flex:none}
.tab.dirty .disk{background:var(--syn-attr)}
.tab.ro .disk{background:var(--gutter-ink);border-radius:1px}
.tab .x{width:18px;height:18px;display:grid;place-items:center;border-radius:3px;border:0;background:none;color:var(--ink-2);cursor:pointer;font-size:14px;line-height:1;padding:0}
.tab .x:hover{background:var(--syn-attr);color:var(--on-accent)}
.tab-add{border:0;background:none;padding:4px 8px;color:var(--ink-2);cursor:pointer;font-size:16px;line-height:1;align-self:center}

.panel{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--chrome);flex:none}
.panel label.f{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 220px}
.panel label.f span{min-width:62px;flex:none;white-space:nowrap;color:var(--ink-2)}
.panel input[type=text],.panel input[type=number]{flex:1;min-width:0;padding:3px 6px;border:1px solid var(--line);border-radius:3px;background:var(--paper);font-family:var(--mono);font-size:12.5px}
.panel input.bad{border-color:var(--syn-err)}
.opts{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.opts label{display:flex;align-items:center;gap:4px;white-space:nowrap}
.opts .grp{display:flex;gap:8px;padding-left:10px;border-left:1px solid var(--line)}
.btn{padding:3px 10px;border:1px solid var(--line);border-radius:3px;background:var(--paper);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--focus);border-color:var(--focus);color:var(--on-accent)}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:4px;flex-wrap:wrap}
.panel .msg{color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:0}
.panel .close,.sec-h .close,.view-h .close,.res-h .close{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--ink-2);font-size:16px;padding:0 4px;line-height:1}

.main{flex:1;min-height:0;display:flex}
.side{flex:none;width:240px;min-width:0;display:flex;flex-direction:column;background:var(--chrome);overflow:hidden}
#leftSide{border-right:1px solid var(--line)}
#rightSide{border-left:1px solid var(--line)}
.sec{display:flex;flex-direction:column;min-height:0;flex:1}
.sec+.sec{border-top:1px solid var(--line)}
.sec-h{display:flex;align-items:center;gap:6px;padding:4px 8px;font-weight:600;font-size:12px;background:var(--chrome-2);border-bottom:1px solid var(--line);flex:none}
.sec-h .tool{border:0;background:none;cursor:pointer;color:var(--ink-2);padding:0 3px;font-size:13px}
.sec-b{flex:1;overflow:auto;padding:4px 0;font-size:12.5px}
.sec-b input.filter{margin:2px 8px 6px;width:calc(100% - 16px);padding:3px 6px;border:1px solid var(--line);border-radius:3px;background:var(--paper)}
.li{display:flex;align-items:center;gap:6px;width:100%;padding:2px 8px;border:0;background:none;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li:hover{background:var(--sel)}
.li.on{background:var(--sel);font-weight:600}
.li .k{color:var(--ink-2);font-size:11px;font-family:var(--mono);flex:none}
.li .n{overflow:hidden;text-overflow:ellipsis;min-width:0}
.li .dot{width:7px;height:7px;border-radius:50%;background:var(--focus);flex:none}
.li .dot.dirty{background:var(--syn-attr)}
.tree .li{padding-left:calc(8px + var(--d,0) * 14px)}
.tree .tw{width:10px;flex:none;color:var(--ink-2);font-size:10px}
.empty{color:var(--ink-2);padding:8px 10px;font-size:12px;max-width:40ch}
.chars{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;padding:4px 6px}
.chars button{border:1px solid var(--line);background:var(--paper);font-family:var(--mono);font-size:12px;padding:3px 0;cursor:pointer;min-width:0}
.chars button:hover{border-color:var(--focus)}

.views{flex:1;min-width:0;display:flex}
.view{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.view+.view{border-left:2px solid var(--line)}
.view.focus-v .view-h{color:var(--ink)}
.view-h{display:flex;align-items:center;gap:6px;padding:3px 8px;font-size:12px;color:var(--ink-2);background:var(--chrome-2);border-bottom:1px solid var(--line);flex:none;white-space:nowrap;overflow:hidden}
.view-h select{border:1px solid var(--line);background:var(--paper);border-radius:3px;font-size:12px;max-width:60%}
.editor-wrap{flex:1;min-height:0;position:relative;background:var(--paper);font-family:var(--mono);font-size:14px}
.editor-wrap.drop::after{content:attr(data-drop);position:absolute;inset:8px;border:2px dashed var(--focus);border-radius:6px;display:grid;place-items:center;background:var(--paper);color:var(--focus);font-family:var(--ui);z-index:20;opacity:.94}

.results{flex:none;height:30%;min-height:110px;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--paper)}
.res-h{display:flex;align-items:center;gap:8px;padding:3px 8px;background:var(--chrome-2);border-bottom:1px solid var(--line);font-size:12px;font-weight:600}
.res-b{flex:1;overflow:auto;font-family:var(--mono);font-size:12.5px;padding:2px 0}
.res-q{padding:2px 8px;background:var(--chrome);color:var(--ink);font-weight:700}
.res-f{padding:2px 8px 2px 18px;color:var(--syn-com);font-weight:700}
.res-l{display:block;width:100%;text-align:left;border:0;background:none;padding:1px 8px 1px 34px;cursor:pointer;white-space:pre;color:var(--ink);font-family:inherit;font-size:inherit}
.res-l:hover{background:var(--curline)}
.res-l b{color:var(--ink-2);font-weight:400}
.res-l mark{background:var(--hit);color:inherit}

.statusbar{display:flex;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none;background:var(--chrome)}
.statusbar::-webkit-scrollbar{display:none}
.statusbar>*{padding:3px 10px;border-right:1px solid var(--line);white-space:nowrap;flex:none}
.statusbar .grow{flex:1 0 auto}
.statusbar button,.statusbar select{background:none;border:0;padding:3px 10px;cursor:pointer;color:inherit;font-size:12px}
.statusbar button:hover,.statusbar select:hover{color:var(--ink)}
.statusbar select{appearance:none;-webkit-appearance:none}
.statusbar option{background:var(--paper);color:var(--ink)}

/* Full screen, post-it, distraction free */
.win.postit .menubar,.win.postit .toolbar,.win.postit .tabbar,.win.postit .statusbar,
.win.zen .menubar,.win.zen .toolbar,.win.zen .tabbar,.win.zen .statusbar,.win.zen .side,.win.zen .view-h{display:none}
.win.zen #view1 .editor-wrap{padding:0 max(16px,calc((100% - 92ch)/2))}
.win.zen .CodeMirror-gutters{display:none}
.exit-hint{position:fixed;z-index:70;right:calc(12px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));background:var(--chrome);border:1px solid var(--line);border-radius:4px;padding:3px 10px;cursor:pointer;color:var(--ink-2);font-size:12px;opacity:.85}

.menu-pop{position:fixed;z-index:50;min-width:230px;max-width:calc(100vw - 16px);max-height:calc(100vh - 20px);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:4px 0}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:4px 12px 4px 8px;background:none;border:0;text-align:left;cursor:pointer;white-space:nowrap}
.mi:hover,.mi:focus,.mi.open{background:var(--sel);outline:none}
.mi:disabled{color:var(--ink-2);opacity:.55;cursor:default;background:none}
.mi .ck{width:14px;flex:none;color:var(--focus);text-align:center}
.mi .lb{flex:1}
.mi .kb{color:var(--ink-2);font-size:12px;white-space:nowrap;padding-left:16px}
.mi .ar{color:var(--ink-2);font-size:10px}
.msep{height:1px;background:var(--line);margin:4px 0}

.modal-back{position:fixed;inset:0;z-index:80;background:#10131a66;display:grid;place-items:center;padding:16px}
.modal{width:min(460px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--chrome);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.modal.wide{width:min(680px,100%)}
.modal h2{margin:0;font-size:13px;font-weight:600;padding:8px 12px;background:var(--chrome-2);border-bottom:1px solid var(--line);text-wrap:balance}
.modal .bd{padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.modal .bd p{margin:0;max-width:62ch}
.modal input[type=text],.modal input[type=number],.modal select,.modal textarea{padding:4px 7px;border:1px solid var(--line);border-radius:3px;background:var(--paper);font-family:var(--mono);font-size:12.5px;min-width:0}
.modal textarea{resize:vertical;min-height:90px;width:100%}
.modal .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal .row>span:first-child{min-width:150px;color:var(--ink-2)}
.modal fieldset{border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin:0;display:flex;flex-direction:column;gap:6px}
.modal legend{color:var(--ink-2);padding:0 4px;font-size:12px}
.modal table{border-collapse:collapse;font-size:12.5px}
.modal td,.modal th{padding:2px 14px 2px 0;vertical-align:top;text-align:left}
.modal td:first-child{font-family:var(--mono);color:var(--ink-2);white-space:nowrap}
.modal th{font-weight:600;color:var(--ink);padding-top:8px}
.modal .ft{display:flex;justify-content:flex-end;gap:6px;padding:0 12px 12px;flex-wrap:wrap}
.modal .scroll{overflow-x:auto}

.toast{position:fixed;z-index:90;left:50%;transform:translateX(-50%);bottom:calc(46px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:6px 14px;border-radius:4px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

/* CodeMirror 5 core styles */
.CodeMirror{font-family:inherit;height:100%;color:var(--ink);background:var(--paper);direction:ltr;position:relative;overflow:hidden;line-height:1.5}
.CodeMirror-lines{padding:4px 0;cursor:text;min-height:1px}
.CodeMirror pre.CodeMirror-line,.CodeMirror pre.CodeMirror-line-like{padding:0 6px;border-radius:0;border-width:0;background:transparent;font-family:inherit;font-size:inherit;margin:0;white-space:pre;word-wrap:normal;line-height:inherit;color:inherit;z-index:2;position:relative;overflow:visible;-webkit-tap-highlight-color:transparent;font-variant-ligatures:contextual}
.CodeMirror-wrap pre.CodeMirror-line,.CodeMirror-wrap pre.CodeMirror-line-like{word-wrap:break-word;white-space:pre-wrap;word-break:normal}
.CodeMirror-rtl pre{direction:rtl}
.CodeMirror-scrollbar-filler,.CodeMirror-gutter-filler{background:var(--paper)}
.CodeMirror-gutters{border-right:1px solid var(--line);background:var(--gutter);white-space:nowrap;position:absolute;left:0;top:0;min-height:100%;z-index:3}
.CodeMirror-linenumber{padding:0 6px 0 8px;min-width:20px;text-align:right;color:var(--gutter-ink);white-space:nowrap;font-size:.86em}
.CodeMirror-activeline-gutter .CodeMirror-linenumber{color:var(--ink)}
.CodeMirror-cursor{border-left:2px solid var(--ink);border-right:none;width:0;position:absolute;pointer-events:none}
.cm-overwrite .CodeMirror-cursor{border-left:0;width:auto;border-bottom:2px solid var(--ink)}
.CodeMirror-scroll{overflow:scroll!important;margin-bottom:-50px;margin-right:-50px;padding-bottom:50px;height:100%;outline:none;position:relative;z-index:0}
.CodeMirror-sizer{position:relative;border-right:50px solid transparent}
.CodeMirror-vscrollbar,.CodeMirror-hscrollbar,.CodeMirror-scrollbar-filler,.CodeMirror-gutter-filler{position:absolute;z-index:6;display:none;outline:none}
.CodeMirror-vscrollbar{right:0;top:0;overflow-x:hidden;overflow-y:scroll}
.CodeMirror-hscrollbar{bottom:0;left:0;overflow-y:hidden;overflow-x:scroll}
.CodeMirror-scrollbar-filler{right:0;bottom:0}
.CodeMirror-gutter-filler{left:0;bottom:0}
.CodeMirror-gutter{white-space:normal;height:100%;display:inline-block;vertical-align:top;margin-bottom:-50px}
.CodeMirror-gutter-wrapper{position:absolute;z-index:4;background:none!important;border:none!important}
.CodeMirror-gutter-background{position:absolute;top:0;bottom:0;z-index:4}
.CodeMirror-gutter-elt{position:absolute;cursor:default;z-index:4}
.CodeMirror-gutter-wrapper ::selection{background-color:transparent}
.CodeMirror-linebackground{position:absolute;left:0;right:0;top:0;bottom:0;z-index:0}
.CodeMirror-linewidget{position:relative;z-index:2;padding:.1px}
.CodeMirror-code{outline:none}
.CodeMirror-scroll,.CodeMirror-sizer,.CodeMirror-gutter,.CodeMirror-gutters,.CodeMirror-linenumber{box-sizing:content-box}
.CodeMirror-measure{position:absolute;width:100%;height:0;overflow:hidden;visibility:hidden}
.CodeMirror-measure pre{position:static}
div.CodeMirror-cursors{visibility:hidden;position:relative;z-index:3}
div.CodeMirror-dragcursors{visibility:visible}
.CodeMirror-focused div.CodeMirror-cursors{visibility:visible}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected{background:var(--sel)}
.CodeMirror-line::selection,.CodeMirror-line>span::selection,.CodeMirror-line>span>span::selection{background:var(--sel)}
span.CodeMirror-selectedtext{background:none}
.CodeMirror-activeline-background{background:var(--curline)}
.no-curline .CodeMirror-activeline-background{background:none}
.cm-tab{display:inline-block;text-decoration:inherit}
.cm-force-border{padding-right:.1px}
.CodeMirror-matchingbracket{background:var(--match-bg);font-weight:700}
.CodeMirror-nonmatchingbracket{color:var(--syn-err)!important;text-decoration:underline}
.cm-searching{background:var(--hit);border-radius:2px}
.cm-smart{background:var(--smart);border-radius:2px}
.cm-indent{box-shadow:inset 1px 0 0 var(--ws)}

.CodeMirror-hints{position:absolute;z-index:60;overflow:hidden;list-style:none;margin:0;padding:2px;box-shadow:var(--shadow);border-radius:3px;border:1px solid var(--line);background:var(--paper);font-family:var(--mono);font-size:13px;max-height:20em;overflow-y:auto}

<script>
(function(){
'use strict';
/* =====================================================================
   Webpad – core: environment, storage, i18n, languages, documents, editors
   ===================================================================== */
const $ = id => document.getElementById(id);
const Pos = CodeMirror.Pos;
const IN_FRAME = (() => { try { return window.self !== window.top; } catch(e) { return true; } })();
const FS = 'showSaveFilePicker' in window && window.isSecureContext && !IN_FRAME;
const DIR = 'showDirectoryPicker' in window && window.isSecureContext && !IN_FRAME;
const CAN_DL = !IN_FRAME;
const CAN_POPUP = !IN_FRAME;
const STORE = 'webpad-v2', PREFS = 'webpad-prefs', MACROS = 'webpad-macros';
const OLD_STORES = ['notizblock-pp-standalone-v1', 'notizblock-pp-v1'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e) { return false; } }
};
// Small IndexedDB key/value store (file handles survive a reload only here)
const idb = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    try { const r = indexedDB.open('webpad', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch(e) { rej(e); }
  }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('kv', mode); const r = fn(t.objectStore('kv'));
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
  }));
  return {
    get: k => Promise.race([tx('readonly', s => s.get(k)), new Promise(r => setTimeout(() => r(undefined), 1500))]).catch(() => undefined),
    set: (k, v) => tx('readwrite', s => s.put(v, k)).catch(() => {})
  };
})();

/* ---------- Preferences and view state ---------- */
const DEF_PREFS = { lang:'auto', tabSize:4, spaces:false, autoClose:true, curLine:true, lineNumbers:true, bmMargin:true, foldMargin:true,
  smart:true, autoComplete:false, theme:'system', newEol:'CRLF', newEnc:'UTF-8', newLang:'text' };
const prefs = Object.assign({}, DEF_PREFS, ls.get(PREFS, {}));
const DEF_VIEW = { wrap:false, showWs:false, showEol:false, indent:false, zoom:14, rtl:false, syncV:false, syncH:false,
  docList:false, funcList:false, charPanel:false, workspace:false, funcSort:false };
let view = Object.assign({}, DEF_VIEW);

/* ---------- Interface language ---------- */
const UI_LANGS = { de:'Deutsch', en:'English', fr:'Français' };
const LOCALE = { de:'de-DE', en:'en-GB', fr:'fr-FR' };
let uiLang = 'en';
let nf = new Intl.NumberFormat('en-GB');
function resolveLang(){
  if (prefs.lang && prefs.lang !== 'auto' && UI_LANGS[prefs.lang]) return prefs.lang;
  const n = String(navigator.language || 'en').slice(0, 2).toLowerCase();
  return UI_LANGS[n] ? n : 'en';
}
// t('English source text', {vars}) – the English text is the key
function t(s, v){
  const d = I18N[uiLang]; let r = (d && d[s]) || s;
  if (v) r = r.replace(/\{(\w+)\}/g, (m, k) => v[k] !== undefined ? v[k] : m);
  return r;
}
// Plural helper: tp(n, 'one form', 'other form', vars) – {n} is formatted
function tp(n, one, other, v){ return t(n === 1 ? one : other, Object.assign({n: nf.format(n)}, v)); }
const KB_NAMES = {
  de: {Ctrl:'Strg', Shift:'Umschalt', Del:'Entf', Ins:'Einfg', Space:'Leertaste', PgUp:'Bild↑', PgDn:'Bild↓', Click:'Klick', Drag:'Ziehen'},
  fr: {Shift:'Maj', Del:'Suppr', Ins:'Inser', Space:'Espace', PgUp:'Pg.Préc', PgDn:'Pg.Suiv', Enter:'Entrée', Click:'Clic', Drag:'Glisser'}
};

/* =====================================================================
   UI basics: toast, dialogs, clipboard, tabs, session, files
   ===================================================================== */
let toastT;
function toast(msg){ const el = $('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

let dlgResolve = null;
// Generic modal dialog. buttons: [[value, label, cssClass]]; resolves {btn, value, body}
function dialog({title, text, html, input, buttons, wide, onOpen}){
  $('mTitle').textContent = title;
  $('modalBox').classList.toggle('wide', !!wide);
  const body = $('mBody'); body.textContent = '';
  if (text) { const p = document.createElement('p'); p.textContent = text; body.appendChild(p); }
  if (html) body.insertAdjacentHTML('beforeend', html);
  let inp = null;
  if (input != null) { inp = document.createElement('input'); inp.type = 'text'; inp.id = 'mInput'; inp.value = input; inp.spellcheck = false; body.appendChild(inp); }
  const foot = $('mFoot'); foot.textContent = '';
  closeMenus();
  return new Promise(res => {
    dlgResolve = btn => { $('modal').hidden = true; dlgResolve = null; res({btn, value: inp ? inp.value : '', body}); setTimeout(() => { if ($('modal').hidden && !isField(document.activeElement)) E().focus(); }, 0); };
    (buttons || [['ok', t('OK'), 'primary']]).forEach(([v, l, cls]) => {
      const b = document.createElement('button'); b.className = 'btn' + (cls ? ' ' + cls : ''); b.textContent = l; b.type = 'button';
      b.onclick = () => dlgResolve(v); foot.appendChild(b);
    });
    $('modal').hidden = false;
    if (onOpen) onOpen(body);
    if (inp) { inp.focus(); const dot = inp.value.lastIndexOf('.'); inp.setSelectionRange(0, dot > 0 ? dot : inp.value.length);
      inp.onkeydown = e => { if (e.key === 'Enter') dlgResolve(buttons[buttons.length - 1][0]); }; }
    else { const f = body.querySelector('input,select,textarea'); (f || foot.lastChild).focus(); }
  });
}
$('modal').addEventListener('click', e => { if (e.target.id === 'modal' && dlgResolve) dlgResolve(null); });
const ask = (title, text, yes) => dialog({title, text, buttons:[['cancel', t('Cancel')], ['ok', yes || t('OK'), 'primary']]}).then(r => r.btn === 'ok');
const isField = el => el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && !el.closest('.CodeMirror');

function clip(text, msg){
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(e) {}
    ta.remove(); toast(ok ? msg : t('The browser blocked copying'));
  };
  try { navigator.clipboard.writeText(text).then(() => toast(msg), fallback); } catch(e) { fallback(); }
}

/* ---------- Tabs ---------- */
let dragIdx = -1;
function renderTabs(){
  const bar = $('tabbar'); bar.textContent = '';
  docs.forEach((d, i) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (i === active ? ' active' : '') + (isDirty(d) ? ' dirty' : '') + (d.ro ? ' ro' : '');
    tab.setAttribute('role', 'tab'); tab.setAttribute('aria-selected', i === active); tab.tabIndex = 0; tab.draggable = true;
    tab.title = (d.path || d.name) + (d.handle ? '' : ' – ' + t('browser only')) + (d.ro ? ' (' + t('read-only') + ')' : '') + (isDirty(d) ? ' (' + t('modified') + ')' : '');
    tab.innerHTML = '<span class="disk" aria-hidden="true"></span><span class="nm"></span><button class="x"></button>';
    tab.querySelector('.nm').textContent = d.name;
    const x = tab.querySelector('.x'); x.textContent = '×'; x.setAttribute('aria-label', t('Close'));
    tab.addEventListener('click', e => { if (e.target.closest('.x')) closeDoc(i); else { switchTo(i); cm.focus(); } });
    tab.addEventListener('auxclick', e => { if (e.button === 1) { e.preventDefault(); closeDoc(i); } });
    tab.addEventListener('dblclick', e => { if (!e.target.closest('.x')) { switchTo(i); run('file.rename'); } });
    tab.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); switchTo(i); } });
    tab.addEventListener('contextmenu', e => { e.preventDefault(); switchTo(i); openPop(tabMenu(), e.clientX, e.clientY, 0); });
    tab.addEventListener('dragstart', e => { dragIdx = i; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/x-webpad-tab', String(i)); } catch(_) {} });
    tab.addEventListener('dragover', e => { if (dragIdx > -1) { e.preventDefault(); tab.classList.add('drag-over'); } });
    tab.addEventListener('dragleave', () => tab.classList.remove('drag-over'));
    tab.addEventListener('drop', e => { tab.classList.remove('drag-over'); if (dragIdx > -1) { e.preventDefault(); moveTab(dragIdx, i); dragIdx = -1; } });
    tab.addEventListener('dragend', () => { dragIdx = -1; });
    bar.appendChild(tab);
  });

}

function compareWith(o){

  openView2(o, false);
  const a = d.cm.getValue().split('\n'), b = o.cm.getValue().split('\n');

  const pad = (c, line, count, above) => { const el = document.createElement('div'); el.className = 'cmp-pad'; el.style.height = (count * c.defaultTextHeight()) + 'px'; st.w.push(c.addLineWidget(line, el, {above, noHScroll:true})); };

  'Alt-N':'file.new','Ctrl-N':'file.new','Ctrl-O':'file.open','Ctrl-S':'file.save','Ctrl-Alt-S':'file.saveAs','Ctrl-Shift-S':'file.saveAll','Alt-W':'file.close','Ctrl-W':'file.close',
  'Alt-PageDown':'tab.next','Alt-PageUp':'tab.prev','Ctrl-PageDown':'tab.next','Ctrl-PageUp':'tab.prev','Ctrl-Shift-PageDown':'tab.moveFwd','Ctrl-Shift-PageUp':'tab.moveBack',
  'Ctrl-F':'find.open','Ctrl-H':'find.replace','Ctrl-Shift-F':'find.files','Ctrl-M':'find.mark','Ctrl-G':'goto','F3':'find.next','Shift-F3':'find.prev','Ctrl-F3':'find.selNext','Ctrl-Shift-F3':'find.selPrev',
  'F7':'results.toggle','F4':'results.next','Shift-F4':'results.prev','Ctrl-B':'brace.goto','Ctrl-Alt-B':'brace.select',
  'Ctrl-F2':'bm.toggle','F2':'bm.next','Shift-F2':'bm.prev',
  'Ctrl-D':'line.dup','Ctrl-L':'line.del','Ctrl-Shift-L':'line.del','Ctrl-Shift-ArrowUp':'line.up','Ctrl-Shift-ArrowDown':'line.down','Ctrl-J':'line.join','Ctrl-Alt-Enter':'line.insAbove','Ctrl-Alt-Shift-Enter':'line.insBelow',
  'Ctrl-U':'case.lower','Ctrl-Shift-U':'case.upper','Alt-U':'case.proper','Alt-Shift-U':'case.properBlend','Ctrl-Alt-U':'case.sentence','Ctrl-Alt-Shift-U':'case.sentenceBlend',
  'Ctrl-Q':'cmt.toggle','Ctrl-K':'cmt.line','Ctrl-Shift-K':'cmt.uncomment','Ctrl-Shift-Q':'cmt.block',
  'Ctrl- ':'complete','Ctrl-Enter':'complete.word','Alt-C':'edit.colEditor','Alt-H':'view.hide',
  'Alt-0':'fold.all','Alt-Shift-0':'unfold.all','Ctrl-Alt-F':'fold.cur','Ctrl-Alt-Shift-F':'unfold.cur',
  'Ctrl-+':'view.zoomIn','Ctrl-Shift-+':'view.zoomIn','Ctrl-=':'view.zoomIn','Ctrl--':'view.zoomOut','Ctrl-0':'view.zoomReset',
  'F11':'view.fullscreen','F12':'view.postit','F8':'view.focusOther','F1':'help.keys',
  'Ctrl-Shift-R':'macro.toggleRec','Ctrl-Shift-P':'macro.play','Alt-Shift-S':'macro.trimSave'
};
for (let n = 1; n <= 8; n++) { KEYS['Alt-' + n] = 'fold.' + n; KEYS['Alt-Shift-' + n] = 'unfold.' + n; }
for (let n = 1; n <= 9; n++) KEYS['Ctrl-' + n] = 'tab.' + n;
// Commands that may run while focus is in a text field
const FIELD_OK = /^(file\.|find\.open|find\.replace|find\.files|goto|help|view\.(fullscreen|postit|zoom)|tab\.|results)/;
function leaveModes(){
  const w = $('win');
  if (w.classList.contains('postit') || w.classList.contains('zen')) { w.classList.remove('postit', 'zen'); $('exitHint').hidden = true; applyView(); return true; }
  return false;
}
$('exitHint').onclick = () => { leaveModes(); E().focus(); };
document.addEventListener('fullscreenchange', () => {
  const on = !!document.fullscreenElement;
  $('app').classList.toggle('full', on); $('titlebar').hidden = !on;
  updateFsBtn(); updateTitleBar(); eds().forEach(c => c.refresh());
});
function updateTitleBar(){
  [['tbMin', 'Minimize'], ['tbMax', 'Restore Down'], ['tbClose', 'Close Webpad']].forEach(([id, l]) => { $(id).title = t(l); $(id).setAttribute('aria-label', t(l)); });
}
const leaveFullscreen = () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); };
$('tbMin').onclick = leaveFullscreen;
$('tbMax').onclick = leaveFullscreen;
$('titlebar').addEventListener('dblclick', e => { if (!e.target.closest('button')) leaveFullscreen(); });
$('tbClose').onclick = () => run('win.close');
// Browsers only let a page close its own tab when it was opened by a script or has no history
async function closeApp(){
  const dirty = docs.filter(isDirty);
  if (dirty.length && !(await ask(t('Close Webpad'), tp(dirty.length, '{n} document has unsaved changes. Close anyway? The text stays stored in this browser.', '{n} documents have unsaved changes. Close anyway? The text stays stored in this browser.'), t('Close anyway')))) return;
  persistNow(); saveHandles();
  try { window.close(); } catch(e) {}
  setTimeout(() => { if (!window.closed) { leaveFullscreen(); toast(kbl(t('The browser does not let Webpad close this tab. Close it with Ctrl+W.'))); } }, 250);
}
window.addEventListener('keydown', e => {
  if (!$('modal').hidden) { if (e.key === 'Escape' && dlgResolve) { e.preventDefault(); dlgResolve(null); } return; }
  if (pops.length && e.target.closest && e.target.closest('.menu-pop')) return;
  if (e.key === 'Escape') {
    if (pops.length) { closeMenus(); E().focus(); return; }
    if (E().state.completionActive) return;
    if (leaveModes()) { e.preventDefault(); return; }
    if (!$('findPanel').hidden && !isField(e.target)) { closeFind(); return; }
    if (!$('gotoPanel').hidden) { $('gClose').click(); return; }
    return;
  }
  // Physical key codes keep shortcuts layout-independent (DE/FR/US)
  let k = /^Key[A-Z]$/.test(e.code) ? e.code.slice(3) : /^Digit\d$/.test(e.code) ? e.code.slice(5) : /^Numpad\d$/.test(e.code) ? e.code.slice(6) : (e.key.length === 1 ? e.key.toUpperCase() : e.key);
  if (e.code === 'NumpadAdd') k = '+'; if (e.code === 'NumpadSubtract') k = '-';
  if (e.code === 'Space') k = ' ';
  if (e.code === 'Enter' || e.code === 'NumpadEnter') k = 'Enter';
  const combo = (e.ctrlKey || e.metaKey ? 'Ctrl-' : '') + (e.altKey ? 'Alt-' : '') + (e.shiftKey ? 'Shift-' : '') + k;
  const id = KEYS[combo]; if (!id) return;
  if (isField(e.target) && !FIELD_OK.test(id)) return;
  if (E().state.completionActive && /^(complete|line\.ins)/.test(id)) return;
  e.preventDefault(); e.stopPropagation(); closeMenus(); run(id); updateToolbar();
}, true);
window.addEventListener('beforeunload', () => { persistNow(); saveHandles(); });

/* =====================================================================
   Start-up
   ===================================================================== */
const SAMPLE_JS = `// Sample file: syntax highlighting, folding, bookmarks, find and replace.
// Try Ctrl+D (duplicate line), Ctrl+Q (comment), Ctrl+F2 (bookmark)
// or double-click a word (smart highlighting).

const stock = [
\t{ item: "Screws M4", qty: 1200, price: 0.04 },
\t{ item: "Nuts M4", qty: 800, price: 0.03 },
\t{ item: "Washers M4", qty: 950, price: 0.02 },
];

function stockValue(entries) {
\treturn entries.reduce((sum, e) => sum + e.qty * e.price, 0);
}

class Warehouse {
\tconstructor(entries) {
\t\tthis.entries = entries;
\t}
\tlow(limit = 900) {
\t\treturn this.entries.filter(e => e.qty < limit);
\t}
}

if (stock.length > 0) {
\tconsole.log(\`Stock value: \${stockValue(stock).toFixed(2)} €\`); // 91.00
}
`;
window.webpad = { run, commands: () => Object.keys(C), lang: () => uiLang };
(async function start(){
  uiLang = resolveLang();
  let ok = false; try { ok = await restore(); } catch(e) { console.error(e); }
  if (!ok) { docs = [makeDoc({name:'sample.js', text:SAMPLE_JS, eol:'CRLF'}), makeDoc({name: t('notes') + '.md', text: SAMPLE_MD[uiLang] || SAMPLE_MD.en, eol:'LF'})]; active = 0; }
  switchTo(active); applyPrefs(); cm.focus();
  recentCache = (await idb.get('recent')) || [];
  const wh = DIR ? await idb.get('workspace') : null;
  if (wh) { ws = {root: wh, cache: new Map(), expanded: new Set(['']), granted: false}; try { ws.granted = (await wh.queryPermission({mode:'readwrite'})) === 'granted'; } catch(e) {} if (view.workspace) renderSides(); }
})();
})();

</script>
