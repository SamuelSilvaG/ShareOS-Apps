<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gauge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="hub" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
  </defs>

  <!-- Background tile -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)"/>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Gauge Arc Track -->
  <path d="M16 42 A 20 20 0 1 1 48 42" fill="none" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Active Speed Arc -->
  <path d="M16 42 A 20 20 0 1 1 45 23" fill="none" stroke="url(#gauge)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Tick marks -->
  <line x1="19" y1="38" x2="22" y2="36" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="23" x2="26" y2="26" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="18" x2="32" y2="22" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="23" x2="38" y2="26" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Speed motion wind trails -->
  <path d="M13 48 L22 48" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M10 52 L26 52" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Needle pointing to the right (speeding) -->
  <polygon points="32,32 30,34 46,21 34,30" fill="url(#needle)"/>
  <line x1="32" y1="32" x2="45" y2="21" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Center Pin Hub -->
  <circle cx="32" cy="32" r="4.5" fill="#0f172a"/>
  <circle cx="32" cy="32" r="3" fill="url(#hub)"/>
</svg>
