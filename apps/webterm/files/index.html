<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebTerm – ShareOS Terminal</title>
  <link rel="icon" href="icon.svg">
  <!-- ShareOS look and SDK; outside ShareOS these are simply missing -->
  <link rel="stylesheet" href="/_shareos/theme.css">
  <link rel="stylesheet" href="style.css">
  <script src="/_shareos/app.js"></script>
</head>
<body>

  <header class="titlebar">
    <div class="tabs-container" id="tabs-container"></div>
    <button class="new-tab-btn" id="new-tab-btn" title="Neuer Tab (Strg+Shift+T)" aria-label="Neuer Tab">+</button>
    <div class="status-right" id="status-right">ShareOS WebTerm v1.0</div>
  </header>

  <main class="terminal-viewport" id="terminal-viewport">
    <canvas id="matrix-canvas"></canvas>
    <div id="terminal-output" role="log" aria-live="polite"></div>
    <div class="input-line">
      <span class="prompt" id="prompt-label"></span>
      <input type="text" class="cmd-input" id="cmd-input" autofocus autocomplete="off" spellcheck="false" aria-label="Befehl">
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
