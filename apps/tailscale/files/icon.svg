<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ts-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
  </defs>
  <!-- Background icon shape -->
  <rect width="100" height="100" rx="22" fill="url(#ts-grad)"/>
  
  <!-- 3x3 Tailscale grid dots (centers at x: 30, 50, 70; y: 30, 50, 70; radius 6.5) -->
  <!-- Row 1: empty, filled, filled -->
  <circle cx="30" cy="30" r="6.5" fill="#4a5568" opacity="0.4" />
  <circle cx="50" cy="30" r="6.5" fill="#ffffff" />
  <circle cx="70" cy="30" r="6.5" fill="#ffffff" />

  <!-- Row 2: filled, filled, empty -->
  <circle cx="30" cy="50" r="6.5" fill="#ffffff" />
  <circle cx="50" cy="50" r="6.5" fill="#ffffff" />
  <circle cx="70" cy="50" r="6.5" fill="#4a5568" opacity="0.4" />

  <!-- Row 3: empty, filled, filled -->
  <circle cx="30" cy="70" r="6.5" fill="#4a5568" opacity="0.4" />
  <circle cx="50" cy="70" r="6.5" fill="#ffffff" />
  <circle cx="70" cy="70" r="6.5" fill="#ffffff" />
</svg>
