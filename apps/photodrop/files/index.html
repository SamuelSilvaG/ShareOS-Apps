<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoDrop</title>
  <link rel="stylesheet" href="/_shareos/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="sos-app photo-body">
  <header class="photo-header">
    <div class="brand">
      <span class="brand-icon">📸</span>
      <span class="brand-title">PhotoDrop</span>
      <span class="version-badge">v1.0.1</span>
    </div>

    <div class="header-center">
      <label class="upload-btn" for="file-picker">
        <span class="btn-icon">📤</span>
        <span>Fotos hochladen</span>
      </label>
      <input type="file" id="file-picker" accept="image/*" multiple hidden>
    </div>

    <div class="header-right">
      <button class="sos-btn" id="refresh-btn" title="Galerie neu laden">🔄</button>
      <div class="account-pill" id="user-display">Account: ...</div>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <main class="gallery-stage">
    <!-- Upload Dropzone / Mobile Action -->
    <div class="dropzone" id="dropzone">
      <div class="dropzone-inner">
        <span class="drop-icon">🖼️</span>
        <span class="drop-title">Fotos hier hineinziehen oder tippen</span>
        <span class="drop-sub">Bilder werden automatisch im Monatsordner auf deiner Box abgelegt</span>
      </div>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="gallery-grid"></div>

    <div class="empty-gallery hidden" id="empty-gallery">
      <span>Keine Fotos im Ordner gefunden. Lade deine ersten Urlaubsbilder oder Schnappschüsse hoch!</span>
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div class="lightbox-backdrop hidden" id="lightbox">
    <div class="lightbox-container">
      <button class="lightbox-close" id="lightbox-close">✕</button>
      <img id="lightbox-img" src="" alt="Vollbild">
      <div class="lightbox-bar">
        <span id="lightbox-filename">foto.jpg</span>
        <button class="del-btn" id="lightbox-del-btn">🗑 Löschen</button>
      </div>
    </div>
  </div>

  <footer class="photo-footer">
    <span id="photo-count">0 Fotos</span>
    <span id="storage-status">Verbinde mit Box-Dateisystem...</span>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <script src="/_shareos/app.js"></script>
  <script src="app.js"></script>
</body>
</html>
