<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PackList - Reise- & Checklisten</title>
  <link rel="stylesheet" href="/_shareos/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="sos-app pack-body">
  <header class="pack-header">
    <div class="brand">
      <span class="brand-icon">🧳</span>
      <span class="brand-title">PackList</span>
      <span class="version-badge">v1.0.0</span>
    </div>

    <div class="header-center">
      <select id="list-selector" aria-label="Aktive Packliste wählen"></select>
      <button class="icon-head-btn" id="new-list-btn" title="Neue Liste anlegen">➕ Neue Liste</button>
    </div>

    <div class="header-right">
      <button class="icon-head-btn reset-btn" id="reset-checks-btn" title="Alle Haken zurücksetzen">🔄 Reset</button>
      <div class="account-pill" id="user-display">Account: ...</div>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <!-- Progress Bar Header -->
  <section class="progress-section">
    <div class="progress-info">
      <span class="progress-title" id="active-list-title">Reise-Packliste</span>
      <span class="progress-stats" id="progress-stats">0 von 0 eingepackt (0%)</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </section>

  <!-- Main Checklist Workspace -->
  <main class="pack-workspace">
    <!-- Quick Add Item Row -->
    <section class="quick-add-card">
      <form id="quick-add-form" onsubmit="return false;">
        <input type="text" id="new-item-input" placeholder="Gegenstand hinzufügen (z. B. Reisepass, Sonnencreme, Ladekabel)..." required>
        <select id="new-item-category">
          <option value="Dokumente & Geld">🛂 Dokumente & Geld</option>
          <option value="Elektronik & Kabel">🔌 Elektronik & Kabel</option>
          <option value="Kleidung">👕 Kleidung</option>
          <option value="Hygiene & Apotheke">🧴 Hygiene & Apotheke</option>
          <option value="Outdoor & Sonstiges">⛺ Outdoor & Sonstiges</option>
        </select>
        <button type="submit" class="submit-add-btn">Hinzufügen</button>
      </form>
    </section>

    <!-- Categories & Items Container -->
    <section class="categories-container" id="categories-container"></section>

    <div class="empty-state hidden" id="empty-state">
      <span class="empty-icon">🎒</span>
      <span class="empty-title">Keine Gegenstände auf dieser Liste</span>
      <span class="empty-sub">Füge oben Gegenstände hinzu oder wähle eine fertige Vorlage!</span>
    </div>
  </main>

  <!-- Create List Modal -->
  <div class="modal-backdrop hidden" id="list-modal">
    <div class="modal-dialog">
      <div class="modal-head">
        <h2>Neue Liste anlegen</h2>
        <button class="close-x-btn" id="close-modal-x">✕</button>
      </div>
      <form id="create-list-form" class="modal-form" onsubmit="return false;">
        <div class="form-group">
          <label for="f-list-name">Name der Packliste</label>
          <input type="text" id="f-list-name" placeholder="z. B. Italien Roadtrip, Camping Wochenende" required>
        </div>
        <div class="form-group">
          <label for="f-list-template">Vorlage wählen</label>
          <select id="f-list-template">
            <option value="travel">✈️ Standard Urlaubsreise (Dokumente, Kleidung, Technik)</option>
            <option value="camping">⛺ Camping & Outdoor (Zelt, Kocher, Erste Hilfe)</option>
            <option value="tech">💻 Digital Nomad & IT (Kabel, VPN, Powerbank)</option>
            <option value="empty">📄 Leere Liste erstellen</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="cancel-btn" id="cancel-list-btn">Abbrechen</button>
          <button type="submit" class="save-btn" id="save-list-btn">Erstellen</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="pack-footer">
    <span id="storage-status">Verbinde mit Box-Dateisystem...</span>
    <span id="list-counter-stats">1 Liste aktiv</span>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <script src="/_shareos/app.js"></script>
  <script src="app.js"></script>
</body>
</html>
