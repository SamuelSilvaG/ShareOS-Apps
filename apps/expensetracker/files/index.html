<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpenseTracker - Ausgaben & Budget</title>
  <link rel="stylesheet" href="/_shareos/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="sos-app expense-body">
  <header class="expense-header">
    <div class="brand">
      <span class="brand-icon">💳</span>
      <span class="brand-title">ExpenseTracker</span>
      <span class="version-badge">v1.0.1</span>
    </div>

    <div class="header-center">
      <button class="nav-month-btn" id="prev-month-btn">◀</button>
      <span class="current-month-label" id="current-month-label">Oktober 2026</span>
      <button class="nav-month-btn" id="next-month-btn">▶</button>
    </div>

    <div class="header-right">
      <button class="action-top-btn" id="export-csv-btn" title="Als CSV für SheetOS / Excel exportieren">📥 CSV</button>
      <button class="action-top-btn add-btn" id="open-add-btn">➕ Neuer Eintrag</button>
      <div class="account-pill" id="user-display">Account: ...</div>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <!-- Main Content Stage -->
  <main class="expense-workspace">
    <!-- Top Summary Dashboard -->
    <section class="summary-cards">
      <div class="summary-card card-income">
        <span class="card-label">Einnahmen</span>
        <span class="card-amount" id="sum-income">+0,00 €</span>
      </div>
      <div class="summary-card card-expense">
        <span class="card-label">Ausgaben</span>
        <span class="card-amount" id="sum-expense">-0,00 €</span>
      </div>
      <div class="summary-card card-balance">
        <span class="card-label">Saldo / Rest</span>
        <span class="card-amount" id="sum-balance">0,00 €</span>
      </div>
    </section>

    <!-- Filter & Categories Bar -->
    <section class="filter-bar">
      <div class="filter-group">
        <button class="cat-pill active" data-cat="all">Alle</button>
        <button class="cat-pill" data-cat="Lebensmittel">🛒 Lebensmittel</button>
        <button class="cat-pill" data-cat="Restaurant">☕ Restaurant & Café</button>
        <button class="cat-pill" data-cat="Transport">🚆 Mobilität & Tanken</button>
        <button class="cat-pill" data-cat="Wohnen">🏠 Wohnen & Fixkosten</button>
        <button class="cat-pill" data-cat="Freizeit">🎮 Freizeit & Shopping</button>
        <button class="cat-pill" data-cat="Gehalt">💼 Einnahmen</button>
        <button class="cat-pill" data-cat="Sonstiges">📦 Sonstiges</button>
      </div>
      <input type="text" id="expense-search" placeholder="Einträge filtern...">
    </section>

    <!-- Transactions List -->
    <section class="transactions-container">
      <div class="transactions-list" id="transactions-list"></div>
      <div class="empty-state hidden" id="empty-state">
        <span class="empty-icon">🧾</span>
        <span class="empty-title">Keine Buchungen in diesem Monat</span>
        <span class="empty-sub">Tippe oben auf „Neuer Eintrag“, um deine Ausgaben unterwegs direkt zu erfassen!</span>
      </div>
    </section>
  </main>

  <!-- Add / Edit Transaction Modal -->
  <div class="modal-backdrop hidden" id="entry-modal">
    <div class="modal-dialog">
      <div class="modal-head">
        <h2 id="modal-heading">Buchung erfassen</h2>
        <button class="close-x-btn" id="close-modal-x">✕</button>
      </div>
      <form id="entry-form" class="modal-form" onsubmit="return false;">
        <div class="form-row type-toggle-row">
          <button type="button" class="type-toggle active expense" id="type-exp-btn">Ausgabe</button>
          <button type="button" class="type-toggle income" id="type-inc-btn">Einnahme</button>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="f-amount">Betrag (€)</label>
            <input type="number" step="0.01" id="f-amount" placeholder="0.00" required autofocus>
          </div>
          <div class="form-group">
            <label for="f-date">Datum</label>
            <input type="date" id="f-date" required>
          </div>
        </div>

        <div class="form-group">
          <label for="f-desc">Beschreibung / Zweck</label>
          <input type="text" id="f-desc" placeholder="z. B. Supermarkt-Einkauf, Tanken, Gehalt..." required>
        </div>

        <div class="form-group">
          <label for="f-category">Kategorie</label>
          <select id="f-category">
            <option value="Lebensmittel">🛒 Lebensmittel</option>
            <option value="Restaurant">☕ Restaurant & Café</option>
            <option value="Transport">🚆 Mobilität & Tanken</option>
            <option value="Wohnen">🏠 Wohnen & Fixkosten</option>
            <option value="Freizeit">🎮 Freizeit & Shopping</option>
            <option value="Gehalt">💼 Einnahmen / Gehalt</option>
            <option value="Sonstiges">📦 Sonstiges</option>
          </select>
        </div>

        <div class="modal-actions">
          <button type="button" class="del-btn hidden" id="modal-delete-btn">Löschen</button>
          <button type="button" class="cancel-btn" id="modal-cancel-btn">Abbrechen</button>
          <button type="submit" class="save-btn" id="modal-save-btn">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="expense-footer">
    <span id="storage-status">Verbinde mit Box-Dateisystem...</span>
    <span id="entry-stats">0 Buchungen</span>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <script src="/_shareos/app.js"></script>
    <script src="sos-i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
